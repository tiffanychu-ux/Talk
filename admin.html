<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班親會回覆統計｜後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16303D;
    --ink-soft:#5A7280;
    --line:#D8E0E3;
    --line-strong:#B9C7CC;
    --bg:#EBF0F1;
    --main:#1D5A4F;
    --main-mid:#2C7A6B;
    --main-soft:#E3EFEB;
    --danger:#A33A2B;
    --danger-soft:#F5E4E1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:0 0 60px;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:17px;line-height:1.65;
  }
  .wrap{max-width:840px;margin:0 auto;padding:0 16px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;}

  /* ── 密碼頁 ── */
  #gate{max-width:340px;margin:15vh auto 0;text-align:center;}
  #gate h1{font-size:21px;margin:0 0 18px;}
  #gate input{
    width:100%;font:inherit;font-size:22px;text-align:center;letter-spacing:8px;
    padding:14px;border:2px solid var(--line-strong);border-radius:11px;margin-bottom:12px;
  }
  #gate input:focus{outline:none;border-color:var(--main-mid);box-shadow:0 0 0 4px rgba(44,122,107,.16);}
  .gate-err{color:var(--danger);min-height:1.6em;margin:10px 0 0;font-size:16px;}

  /* ── 主畫面 ── */
  #panel{display:none;}
  #panel.show{display:block;}
  .hero{background:var(--main);color:#fff;padding:24px 0 22px;border-radius:0 0 20px 20px;margin-bottom:20px;}
  .hero h1{font-size:23px;margin:0 0 2px;}
  .hero p{margin:0;color:#B7D6CD;font-size:16px;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;}
  .stat b{display:block;font-size:34px;line-height:1.15;color:var(--main);font-weight:700;}
  .stat span{color:var(--ink-soft);font-size:15px;}
  .stat.total b{color:var(--ink);}

  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .btn{
    font:inherit;font-weight:700;color:#fff;background:var(--main);
    border:none;border-radius:10px;padding:12px 18px;cursor:pointer;
  }
  .btn.ghost{background:#fff;color:var(--main);border:2px solid var(--main);padding:10px 16px;}
  .search{
    flex:1;min-width:150px;font:inherit;padding:11px 14px;
    border:2px solid var(--line-strong);border-radius:10px;background:#fff;
  }
  .search:focus{outline:none;border-color:var(--main-mid);box-shadow:0 0 0 4px rgba(44,122,107,.16);}
  .live{color:var(--ink-soft);font-size:15px;margin-left:auto;}

  /* ── 名單 ── */
  .list{display:grid;gap:10px;}
  .item{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;display:grid;
    grid-template-columns:1fr auto;gap:6px 12px;align-items:start;
  }
  .item.no{background:#FCFAFA;}
  .who{font-size:19px;font-weight:700;}
  .who .klass{color:var(--ink-soft);font-weight:500;margin-right:8px;font-size:17px;}
  .tag{display:inline-block;padding:3px 12px;border-radius:999px;font-size:15px;font-weight:500;white-space:nowrap;}
  .tag.yes{background:var(--main-soft);color:var(--main);}
  .tag.no{background:var(--danger-soft);color:var(--danger);}
  .note{grid-column:1/-1;color:var(--ink-soft);font-size:16px;
    background:#F4F7F7;border-radius:9px;padding:9px 12px;margin-top:2px;}
  .meta{grid-column:1/-1;display:flex;gap:12px;align-items:center;
    color:var(--ink-soft);font-size:15px;margin-top:4px;}
  .meta .acts{margin-left:auto;display:flex;gap:6px;}
  .mini{
    font:inherit;font-size:15px;background:none;border:1px solid var(--line-strong);
    border-radius:8px;padding:5px 12px;color:var(--ink-soft);cursor:pointer;
  }
  .mini:hover{border-color:var(--main);color:var(--main);}
  .mini.del:hover{border-color:var(--danger);color:var(--danger);}
  .empty{text-align:center;color:var(--ink-soft);padding:44px 10px;}

  /* ── 編輯視窗 ── */
  #modal{
    display:none;position:fixed;inset:0;background:rgba(22,48,61,.5);
    align-items:center;justify-content:center;padding:16px;z-index:10;
  }
  #modal.show{display:flex;}
  .sheet{background:#fff;border-radius:16px;padding:22px 20px;width:100%;max-width:400px;
    max-height:90vh;overflow:auto;}
  .sheet h2{font-size:20px;margin:0 0 18px;}
  .sheet label{display:block;font-weight:700;font-size:16px;margin-bottom:7px;}
  .sheet .fld{margin-bottom:16px;}
  .sheet input[type=text],.sheet textarea{
    width:100%;font:inherit;padding:11px 13px;border:2px solid var(--line-strong);
    border-radius:10px;background:#fff;color:inherit;
  }
  .sheet textarea{min-height:70px;resize:vertical;}
  .sheet input:focus,.sheet textarea:focus{outline:none;border-color:var(--main-mid);
    box-shadow:0 0 0 4px rgba(44,122,107,.16);}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .seg label,.seg4 label{
    text-align:center;padding:11px 4px;border:2px solid var(--line-strong);
    border-radius:10px;font-weight:500;cursor:pointer;margin:0;font-size:17px;
  }
  .seg label:has(input:checked),.seg4 label:has(input:checked){
    border-color:var(--main);background:var(--main-soft);color:var(--main);font-weight:700;
  }
  .seg input,.seg4 input{position:absolute;opacity:0;width:0;height:0;}
  #editCount{display:none;}
  #editCount.show{display:block;}
  .sheet-bar{display:flex;gap:10px;margin-top:22px;}
  .sheet-bar .btn{flex:1;}
</style>
</head>
<body>

<div class="wrap">
  <div class="card" id="gate">
    <h1>班親會回覆統計</h1>
    <input type="password" id="pw" inputmode="numeric" placeholder="密碼" autocomplete="off">
    <button class="btn" id="enter" style="width:100%;font-size:19px;padding:15px;">進入</button>
    <p class="gate-err" id="gateErr"></p>
  </div>
</div>

<div id="panel">
  <div class="hero">
    <div class="wrap">
      <h1>班親會回覆統計</h1>
      <p>9/18（五）18:00 – 18:50　資優三教室</p>
    </div>
  </div>

  <div class="wrap">
    <div class="stats">
      <div class="stat total"><b id="sTotal">0</b><span>已回覆</span></div>
      <div class="stat"><b id="sYes">0</b><span>會出席（人）</span></div>
      <div class="stat"><b id="sPeople">0</b><span>家長總人數</span></div>
    </div>

    <div class="bar">
      <input type="text" class="search" id="search" placeholder="搜尋班級或姓名">
      <button class="btn" id="csv">下載名單</button>
      <button class="btn ghost" id="logout">登出</button>
      <span class="live" id="live">連線中…</span>
    </div>

    <div class="list" id="list"></div>
    <p class="empty" id="empty">還沒有人回覆。</p>
  </div>
</div>

<div id="modal">
  <div class="sheet">
    <h2>編輯回覆</h2>
    <div class="fld">
      <label for="eKlass">班級</label>
      <input type="text" id="eKlass">
    </div>
    <div class="fld">
      <label for="eName">學生姓名</label>
      <input type="text" id="eName">
    </div>
    <div class="fld">
      <label>出席</label>
      <div class="seg">
        <label><input type="radio" name="eAttend" value="yes">會出席</label>
        <label><input type="radio" name="eAttend" value="no">無法出席</label>
      </div>
    </div>
    <div class="fld" id="editCount">
      <label>家長人數</label>
      <div class="seg4">
        <label><input type="radio" name="eCount" value="1">1 位</label>
        <label><input type="radio" name="eCount" value="2">2 位</label>
        <label><input type="radio" name="eCount" value="3">3 位</label>
        <label><input type="radio" name="eCount" value="4">4 位</label>
      </div>
    </div>
    <div class="fld">
      <label for="eNote">想跟老師說的話</label>
      <textarea id="eNote"></textarea>
    </div>
    <div class="sheet-bar">
      <button class="btn ghost" id="eCancel">取消</button>
      <button class="btn" id="eSave">儲存</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, deleteDoc, updateDoc, doc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlOpioJoUboSdLjCxw4_NPHt35fKx33bI",
  authDomain: "talk-f532e.firebaseapp.com",
  projectId: "talk-f532e",
  storageBucket: "talk-f532e.firebasestorage.app",
  messagingSenderId: "1050456675156",
  appId: "1:1050456675156:web:1e8264347d616ab64d6ec1",
  measurementId: "G-MFBVSSPW2W"
};

const db = getFirestore(initializeApp(firebaseConfig));
const COLLECTION = "rsvp_20260918";
const PASSWORD = "072929";

/* ── 密碼 ── */
const gate = document.getElementById("gate");
const panel = document.getElementById("panel");
const pw = document.getElementById("pw");
const gateErr = document.getElementById("gateErr");

function unlock(){
  gate.parentElement.style.display = "none";
  panel.classList.add("show");
  listen();
}
function tryEnter(){
  if (pw.value.trim() === PASSWORD) {
    sessionStorage.setItem("rsvpAdmin", "1");
    unlock();
  } else {
    gateErr.textContent = "密碼不對，再試一次。";
    pw.value = ""; pw.focus();
  }
}
document.getElementById("enter").addEventListener("click", tryEnter);
pw.addEventListener("keydown", e => { if (e.key === "Enter") tryEnter(); });
document.getElementById("logout").addEventListener("click", () => {
  sessionStorage.removeItem("rsvpAdmin");
  location.reload();
});
if (sessionStorage.getItem("rsvpAdmin") === "1") unlock();

/* ── 資料 ── */
let data = [];
const list = document.getElementById("list");
const empty = document.getElementById("empty");
const search = document.getElementById("search");

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(ts){
  if (!ts || !ts.toDate) return "剛剛";
  const d = ts.toDate(), p = n => String(n).padStart(2, "0");
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function listen(){
  const q = query(collection(db, COLLECTION), orderBy("createdAt", "desc"));
  onSnapshot(q, snap => {
    data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
    document.getElementById("live").textContent = "即時更新中";
  }, e => {
    console.error(e);
    document.getElementById("live").textContent = "讀取失敗，請重新整理";
  });
}

search.addEventListener("input", render);

function render(){
  const kw = search.value.trim();
  const shown = kw
    ? data.filter(d => `${d.klass ?? ""}${d.studentName ?? ""}`.includes(kw))
    : data;

  document.getElementById("sTotal").textContent = data.length;
  document.getElementById("sYes").textContent = data.filter(d => d.attending).length;
  document.getElementById("sPeople").textContent =
    data.reduce((s, d) => s + (d.attending ? Number(d.count || 0) : 0), 0);

  empty.style.display = shown.length ? "none" : "block";
  empty.textContent = data.length ? "沒有符合的資料。" : "還沒有人回覆。";

  list.innerHTML = shown.map(d => `
    <div class="item${d.attending ? "" : " no"}">
      <div class="who"><span class="klass">${esc(d.klass) || "—"}</span>${esc(d.studentName)}</div>
      <div>${d.attending
        ? `<span class="tag yes">會出席 ${esc(d.count)} 位</span>`
        : `<span class="tag no">無法出席</span>`}</div>
      ${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}
      <div class="meta">
        <span>${fmt(d.createdAt)}</span>
        <span class="acts">
          <button class="mini edit" data-id="${d.id}">編輯</button>
          <button class="mini del" data-id="${d.id}">刪除</button>
        </span>
      </div>
    </div>`).join("");
}

/* ── 編輯 ── */
const modal = document.getElementById("modal");
const eKlass = document.getElementById("eKlass");
const eName = document.getElementById("eName");
const eNote = document.getElementById("eNote");
const editCount = document.getElementById("editCount");
let editingId = null;

function openEdit(rec){
  editingId = rec.id;
  eKlass.value = rec.klass || "";
  eName.value = rec.studentName || "";
  eNote.value = rec.note || "";
  modal.querySelector(`input[name="eAttend"][value="${rec.attending ? "yes" : "no"}"]`).checked = true;
  const c = String(rec.count || 1);
  const cEl = modal.querySelector(`input[name="eCount"][value="${c}"]`);
  (cEl || modal.querySelector('input[name="eCount"][value="1"]')).checked = true;
  editCount.classList.toggle("show", !!rec.attending);
  modal.classList.add("show");
}
function closeEdit(){ modal.classList.remove("show"); editingId = null; }

modal.addEventListener("change", e => {
  if (e.target.name === "eAttend") editCount.classList.toggle("show", e.target.value === "yes");
});
modal.addEventListener("click", e => { if (e.target === modal) closeEdit(); });
document.getElementById("eCancel").addEventListener("click", closeEdit);

document.getElementById("eSave").addEventListener("click", async () => {
  if (!editingId) return;
  const klassVal = eKlass.value.trim();
  const nameVal = eName.value.trim();
  if (!klassVal || !nameVal) { alert("班級和姓名都要填。"); return; }
  const attending = modal.querySelector('input[name="eAttend"]:checked').value === "yes";
  const count = attending ? Number(modal.querySelector('input[name="eCount"]:checked').value) : 0;
  try {
    await updateDoc(doc(db, COLLECTION, editingId), {
      klass: klassVal, studentName: nameVal, attending, count, note: eNote.value.trim()
    });
    closeEdit();
  } catch (err) {
    console.error(err);
    alert("儲存失敗，請重新整理後再試。");
  }
});

list.addEventListener("click", async e => {
  const btn = e.target.closest("button.mini");
  if (!btn) return;
  const rec = data.find(d => d.id === btn.dataset.id);
  if (!rec) return;

  if (btn.classList.contains("edit")) { openEdit(rec); return; }

  if (!confirm(`要刪除「${rec.klass || ""} ${rec.studentName}」這筆回覆嗎？刪除後無法復原。`)) return;
  try {
    await deleteDoc(doc(db, COLLECTION, rec.id));
  } catch (err) {
    console.error(err);
    alert("刪除失敗，請重新整理後再試。");
  }
});

/* ── 匯出 ── */
document.getElementById("csv").addEventListener("click", () => {
  const head = ["班級", "學生姓名", "出席", "家長人數", "想跟老師說的話", "填寫時間"];
  const body = data.map(d => [
    d.klass || "", d.studentName || "",
    d.attending ? "會出席" : "無法出席",
    d.attending ? d.count : 0,
    d.note || "", fmt(d.createdAt)
  ]);
  const csv = [head, ...body]
    .map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))
    .join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "班親會出席名單_0918.csv";
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
