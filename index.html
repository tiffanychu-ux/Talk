<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班親會出席回覆｜三年級資優班</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16303D;
    --ink-soft:#5A7280;
    --line:#D8E0E3;
    --line-strong:#B9C7CC;
    --bg:#EBF0F1;
    --main:#1D5A4F;
    --main-mid:#2C7A6B;
    --main-soft:#E3EFEB;
    --amber:#8A6A12;
    --amber-bg:#FAF0D6;
    --amber-line:#DDB94F;
    --danger:#A33A2B;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;padding:0 0 60px;
    background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:18px;line-height:1.7;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 16px;}

  .hero{
    background:var(--main);color:#fff;
    padding:30px 0 26px;margin-bottom:22px;
    border-radius:0 0 22px 22px;
  }
  .hero h1{font-size:28px;line-height:1.3;margin:0 0 2px;font-weight:700;letter-spacing:1px;}
  .hero p{margin:0;color:#B7D6CD;font-size:17px;}
  .when{
    margin:20px 0 0;background:rgba(255,255,255,.12);
    border-radius:12px;padding:14px 16px;
    display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:17px;
  }
  .when dt{color:#B7D6CD;}
  .when dd{margin:0;font-weight:500;}
  .when .big{font-size:19px;font-weight:700;}

  .park{
    background:var(--amber-bg);border:1px solid var(--amber-line);
    border-radius:12px;padding:14px 16px;margin-bottom:20px;
    color:var(--amber);font-size:17px;line-height:1.65;
  }
  .park strong{display:block;color:#6B520B;margin-bottom:2px;font-size:18px;}

  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 20px;}
  .field{margin-bottom:26px;}
  .field:last-of-type{margin-bottom:20px;}
  .q{display:block;font-weight:700;font-size:19px;margin-bottom:10px;}
  .row2{display:grid;grid-template-columns:34% 1fr;gap:12px;}

  input[type=text],textarea{
    width:100%;font:inherit;color:inherit;padding:13px 14px;
    border:2px solid var(--line-strong);border-radius:11px;background:#fff;
  }
  input::placeholder,textarea::placeholder{color:#9BADB5;}
  textarea{min-height:86px;resize:vertical;}
  input[type=text]:focus,textarea:focus{
    outline:none;border-color:var(--main-mid);
    box-shadow:0 0 0 4px rgba(44,122,107,.16);
  }
  input.bad,textarea.bad{border-color:var(--danger);}

  .choices{display:grid;gap:10px;}
  .split{grid-template-columns:1fr 1fr;}
  .four{grid-template-columns:repeat(4,1fr);}
  .opt{
    display:block;text-align:center;padding:16px 6px;
    border:2px solid var(--line-strong);border-radius:11px;background:#fff;
    font-size:19px;font-weight:500;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .four .opt{padding:15px 2px;font-size:18px;}
  .opt input{position:absolute;opacity:0;width:0;height:0;}
  .opt:has(input:checked){
    border-color:var(--main);background:var(--main-soft);
    color:var(--main);font-weight:700;
  }
  .opt:has(input:focus-visible){box-shadow:0 0 0 4px rgba(44,122,107,.2);}

  #countField{display:none;}
  #countField.show{display:block;}

  .send{
    width:100%;font:inherit;font-size:20px;font-weight:700;color:#fff;
    background:var(--main);border:none;border-radius:12px;padding:18px;cursor:pointer;
  }
  .send:disabled{background:#93AAA4;cursor:default;}

  .err{
    display:none;margin:14px 0 0;padding:13px 15px;
    background:#F8E9E6;border-radius:10px;color:var(--danger);
    font-size:17px;line-height:1.6;
  }
  .err.show{display:block;}

  #done{display:none;text-align:center;padding:36px 22px;}
  #done.show{display:block;}
  .check{
    width:62px;height:62px;margin:0 auto 16px;border-radius:50%;
    background:var(--main-soft);display:flex;align-items:center;justify-content:center;
  }
  .check svg{width:30px;height:30px;stroke:var(--main);stroke-width:3;fill:none;
    stroke-linecap:round;stroke-linejoin:round;}
  #done h2{font-size:24px;margin:0 0 8px;color:var(--main);}
  #done p{margin:0;color:var(--ink-soft);}
  .recap{
    margin:22px 0 20px;background:var(--main-soft);
    border-radius:12px;padding:16px;font-size:19px;font-weight:500;
  }
  .again{
    font:inherit;font-size:17px;font-weight:500;background:none;
    border:2px solid var(--line-strong);border-radius:10px;
    padding:11px 20px;color:var(--ink-soft);cursor:pointer;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <h1>班親會出席回覆</h1>
    <p>三年級一般智能資優班</p>
    <dl class="when">
      <dt>時間</dt><dd class="big">9/18（五）18:00 – 18:50</dd>
      <dt>地點</dt><dd>資優三教室</dd>
    </dl>
  </div>
</div>

<div class="wrap">

  <div class="park">
    <strong>停車提醒</strong>
    學校沒有提供停車位。育達高中有停車場，但名額有限，建議提早到或共乘。
  </div>

  <form id="form" class="card">
    <div class="field">
      <span class="q">班級與學生姓名</span>
      <div class="row2">
        <input type="text" id="klass" placeholder="班級" autocomplete="off">
        <input type="text" id="name" placeholder="學生姓名" autocomplete="off">
      </div>
    </div>

    <div class="field">
      <span class="q">當天會出席嗎？</span>
      <div class="choices split">
        <label class="opt"><input type="radio" name="attend" value="yes">會出席</label>
        <label class="opt"><input type="radio" name="attend" value="no">無法出席</label>
      </div>
    </div>

    <div class="field" id="countField">
      <span class="q">家長出席人數</span>
      <div class="choices four">
        <label class="opt"><input type="radio" name="count" value="1" checked>1 位</label>
        <label class="opt"><input type="radio" name="count" value="2">2 位</label>
        <label class="opt"><input type="radio" name="count" value="3">3 位</label>
        <label class="opt"><input type="radio" name="count" value="4">4 位</label>
      </div>
    </div>

    <div class="field">
      <span class="q">想跟老師說的話</span>
      <textarea id="note" placeholder="沒有的話可以留空"></textarea>
    </div>

    <button type="submit" class="send" id="send">送出回覆</button>
    <p class="err" id="err"></p>
  </form>

  <section class="card" id="done">
    <div class="check">
      <svg viewBox="0 0 24 24"><polyline points="4 13 9 18 20 6"></polyline></svg>
    </div>
    <h2>回覆完成</h2>
    <p>謝謝您，老師已經收到了。</p>
    <div class="recap" id="recap"></div>
    <button class="again" id="again">再填一位孩子</button>
  </section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlOpioJoUboSdLjCxw4_NPHt35fKx33bI",
  authDomain: "talk-f532e.firebaseapp.com",
  projectId: "talk-f532e",
  storageBucket: "talk-f532e.firebasestorage.app",
  messagingSenderId: "1050456675156",
  appId: "1:1050456675156:web:1e8264347d616ab64d6ec1",
  measurementId: "G-MFBVSSPW2W"
};

const db = getFirestore(initializeApp(firebaseConfig));
const COLLECTION = "rsvp_20260918";

const form  = document.getElementById("form");
const klass = document.getElementById("klass");
const name  = document.getElementById("name");
const note  = document.getElementById("note");
const send  = document.getElementById("send");
const err   = document.getElementById("err");
const done  = document.getElementById("done");
const recap = document.getElementById("recap");
const countField = document.getElementById("countField");

const showError = m => { err.textContent = m; err.classList.add("show"); };
const clearError = () => {
  err.classList.remove("show");
  klass.classList.remove("bad");
  name.classList.remove("bad");
};

form.addEventListener("input", clearError);
form.addEventListener("change", e => {
  if (e.target.name === "attend") {
    countField.classList.toggle("show", e.target.value === "yes");
    clearError();
  }
});

document.getElementById("again").addEventListener("click", () => {
  form.reset();
  countField.classList.remove("show");
  done.classList.remove("show");
  form.style.display = "";
  send.disabled = false;
  send.textContent = "送出回覆";
  klass.focus();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

const withTimeout = (p, ms = 12000) => Promise.race([
  p,
  new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
]);

form.addEventListener("submit", async e => {
  e.preventDefault();
  clearError();

  const klassVal = klass.value.trim();
  const nameVal  = name.value.trim();
  const attendEl = form.querySelector('input[name="attend"]:checked');

  if (!klassVal) { showError("請填寫班級。"); klass.classList.add("bad"); klass.focus(); return; }
  if (!nameVal)  { showError("請填寫學生姓名。"); name.classList.add("bad"); name.focus(); return; }
  if (!attendEl) { showError("請選擇當天會不會出席。"); return; }

  const attending = attendEl.value === "yes";
  const count = attending ? Number(form.querySelector('input[name="count"]:checked').value) : 0;

  send.disabled = true;
  send.textContent = "送出中…";

  try {
    await withTimeout(addDoc(collection(db, COLLECTION), {
      klass: klassVal,
      studentName: nameVal,
      attending,
      count,
      note: note.value.trim(),
      createdAt: serverTimestamp()
    }));

    form.style.display = "none";
    recap.textContent = attending
      ? `${klassVal} ${nameVal}　家長 ${count} 位出席`
      : `${klassVal} ${nameVal}　無法出席`;
    done.classList.add("show");
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e2) {
    console.error(e2);
    send.disabled = false;
    send.textContent = "送出回覆";
    if (e2.code === "permission-denied") {
      showError("資料庫目前不開放寫入，請直接告訴老師這個狀況。");
    } else if (e2.message === "timeout") {
      showError("送不出去，可能是網路不穩或資料庫尚未開通。請稍後再按一次，若還是不行請直接聯絡老師。");
    } else {
      showError("送出失敗，請檢查網路後再按一次。若持續失敗，請直接聯絡老師。");
    }
  }
});
</script>
</body>
</html>
